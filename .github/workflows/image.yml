name: image

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build the Agentbox image
        run: docker build -t hack-the-feed:ci .

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t hack-the-feed:ci .
      - name: Push one immutable tag
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          name="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/hack-the-feed"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag hack-the-feed:ci "${name}:${GITHUB_SHA}"
          docker push "${name}:${GITHUB_SHA}"
          echo "pushed ${name}:${GITHUB_SHA}"
