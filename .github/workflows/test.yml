name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest
        working-directory: backend
      - run: bash scripts/test-gmi-deploy.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Built files do not contain a provider key or the sample creator
        run: |
          if grep -R -n -E "Authorization: Bearer|ORIANE_API_KEY=.+|GMI_API_KEY=.+|Using sample data" frontend/dist; then
            exit 1
          fi
